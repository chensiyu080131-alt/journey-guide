# 寻迹 (journey-guide) — Nginx 静态托管配置（静态导出 + nginx 直接托管 out/）
#
# 应用使用 next.config.js 的 output: 'export' 产出纯静态文件到 out/，
# 无需 Node 运行时（ECS 系统 GLIBC 过旧，无法运行现代 Node，故走静态托管最稳）。
#
# 启用：
#   sudo cp deploy/nginx-xuncheng.conf /etc/nginx/conf.d/xuncheng.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 8080;
    # 47.109.91.112:8080 是当前演示入口；域名接入后把域名追加到这里。
    server_name 47.109.91.112 xuncheng.example.com;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;

    # 静态导出产物根目录（由 .github/workflows/deploy.yml 上传到此处）
    # 实测 nginx -T：8080 端口实际 root 为 /usr/share/nginx/html/xuncheng，
    # 故部署脚本主投该目录；此处保持一致，避免以后切换 conf 时歧义。
    root /usr/share/nginx/html/xuncheng;
    index index.html;

    # Next 静态资源（文件名含 hash）长期缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 静态导出：HTML 用 try_files 回退（trailingSlash 已开启，目录含 index.html）
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 品牌 404 页（Next 静态导出 app/not-found.tsx → out/404.html）
    # 未知路径（如 /route/not-exist-route/）返回品牌 404 页而非 nginx 默认页
    error_page 404 /404.html;
}
